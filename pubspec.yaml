name: foodtracker
description: "Food Tracker - บันทึกว่ากินอะไร ที่ไหน ราคาเท่าไหร่"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo_on_light.png
    - assets/logo_on_red.png
    - assets/sample/
    - assets/emoji/
    - assets/google_fonts/

  fonts:
    - family: Prompt
      fonts:
        - asset: assets/google_fonts/Prompt-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Prompt-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Prompt-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Prompt-Bold.ttf
          weight: 700
